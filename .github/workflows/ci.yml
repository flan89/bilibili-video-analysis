name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查、单元测试与发布物验收
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 离线单元测试
        run: npm test

      - name: Python ASR 契约测试
        run: npm run test:python-contract

      - name: 发布物验收
        run: npm run test:release
